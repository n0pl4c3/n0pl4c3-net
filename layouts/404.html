{{ define "main" }}
<div class="sys-err-404" style="text-align: center; margin-top: 20vh; display: flex; flex-direction: column; align-items: center; gap: 10px;">
    <h1 style="color: var(--wired-red); font-size: 4em; border: none; text-shadow: 0px 0px 8px rgba(139, 0, 0, 0.6); margin: 0;">404</h1>
    <p style="font-family: var(--code-font); font-size: 1.2em; text-transform: uppercase; margin: 0;">ERR_NOT_FOUND</p>
    <p style="color: var(--secondary); margin: 0;">The requested data block does not exist on this server.</p>
    <a href="{{ site.Home.RelPermalink }}" style="margin-top: 20px; display: inline-block; padding: 10px; border: 1px solid var(--tertiary);">Return to Root</a>
</div>
{{ end }}
